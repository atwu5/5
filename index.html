<script>
(()=>{'use strict';
/* ====================== 访问密码门 ======================
 * 默认密码 1688。修改密码：运行 node scripts/hash-password.mjs 新密码，
 * 把输出哈希替换到下方 PASS_HASH 即可（页面内只存哈希，不存明文）。
 * 注意：这是静态页面的轻量门槛（防止随手翻看），并非强安全隔离。 */
const GATE_KEY='aiexplore-gate';
const SALT='ai-explore::gate::';
const PASS_HASH='006a1a89f33e68d57f66c56edb2e0f4bb2b94e275cff49c89f569bd7512ca940';

/* 纯 JS SHA-256 兜底（crypto.subtle 不可用时使用），已在 Node 中与标准实现交叉验证 */
function miniSha256(str){
  var rot=function(v,a){return (v>>>a)|(v<<(32-a))};
  var mp=Math.pow,mw=mp(2,32);
  var K=[],H=[],pc=0,c=2;
  while(pc<64){
    var composite=false;
    for(var i=2;i*i<=c;i++){if(c%i===0){composite=true;break}}
    if(!composite){K[pc]=(mp(c,1/3)*mw)|0;if(pc<8)H[pc]=(mp(c,.5)*mw)|0;pc++}
    c++;
  }
  var bytes=[];
  for(i=0;i<str.length;i++){var b=str.charCodeAt(i);if(b>255)return null;bytes.push(b)}
  var bl=bytes.length;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  var bits=bl*8;
  bytes.push(0,0,0,0,(bits>>>24)&255,(bits>>>16)&255,(bits>>>8)&255,bits&255);
  var w=[],j;
  for(j=0;j<bytes.length;j+=4)w.push(((bytes[j]<<24)|(bytes[j+1]<<16)|(bytes[j+2]<<8)|bytes[j+3])|0);
  for(j=0;j<w.length;j+=16){
    var blk=w.slice(j,j+16);
    for(var i2=16;i2<64;i2++){
      var x=blk[i2-15],y=blk[i2-2];
      var s0=rot(x,7)^rot(x,18)^(x>>>3);
      var s1=rot(y,17)^rot(y,19)^(y>>>10);
      blk[i2]=(blk[i2-16]+s0+blk[i2-7]+s1)|0;
    }
    var a=H[0],b2=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i2=0;i2<64;i2++){
      var S1=rot(e,6)^rot(e,11)^rot(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i2]+blk[i2])|0;
      var S0=rot(a,2)^rot(a,13)^rot(a,22),mj=(a&b2)^(a&cc)^(b2&cc),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b2;b2=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){return ('00000000'+((x>>>0).toString(16))).slice(-8)}).join('');
}
async function sha256Hex(text){
  if(window.crypto&&window.crypto.subtle&&window.crypto.subtle.digest){
    try{
      const buf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch{/* 落到纯 JS 实现 */}
  }
  return miniSha256(unescape(encodeURIComponent(text)));
}

/* ====================== 本地数据（收藏 / 最近使用） ====================== */
const FAV_KEY='aiexplore-fav-v1',LU_KEY='aiexplore-lastused-v1',LEGACY_KEY='atelier-tools-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categoryRank=c=>c==='金融工具'?0:1;
let fav={},lu={};
try{const v=JSON.parse(localStorage.getItem(FAV_KEY));if(v&&typeof v==='object')fav=v}catch{fav={}}
try{const v=JSON.parse(localStorage.getItem(LU_KEY));if(v&&typeof v==='object')lu=v}catch{lu={}}
// 兼容旧版：迁移旧站点存在本地的收藏与最近使用记录
try{
  const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY));
  if(Array.isArray(legacy)){
    let changed=false;
    for(const t of legacy){
      if(!t||!t.id)continue;
      if(t.favorite&&!fav[t.id]){fav[t.id]=true;changed=true}
      if(Number.isFinite(t.lastUsed)&&t.lastUsed>0&&!lu[t.id]){lu[t.id]=t.lastUsed;changed=true}
    }
    if(changed){localStorage.setItem(FAV_KEY,JSON.stringify(fav));localStorage.setItem(LU_KEY,JSON.stringify(lu))}
  }
}catch{}
const persistFav=()=>{try{localStorage.setItem(FAV_KEY,JSON.stringify(fav))}catch{toast('无法保存收藏到浏览器，请检查存储设置')}};
const persistLu=()=>{try{localStorage.setItem(LU_KEY,JSON.stringify(lu))}catch{/* 只读环境忽略 */}};

/* ====================== 工具数据（来自 data/tools.json，管理员维护） ====================== */
let tools=[],currentCat='全部',query='';

async function loadTools(){
  $('tool-count').textContent='加载中…';
  try{
    // 加时间戳绕过缓存，保证访客总能拿到最新发布的工具列表
    const res=await fetch('data/tools.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const raw=Array.isArray(data)?data:(Array.isArray(data.tools)?data.tools:[]);
    tools=raw.map(t=>({...t,favorite:!!fav[t.id],lastUsed:lu[t.id]||null}));
    bindEvents();
    render();
  }catch(err){
    $('tool-count').textContent='加载失败';
    $('tool-grid').innerHTML='<div class="empty">工具数据加载失败，请检查网络后重试。<br><br><button type="button" class="secondary-btn" id="retry-load">重新加载</button></div>';
    const btn=document.getElementById('retry-load');
    if(btn)btn.onclick=loadTools;
  }
}

const icons={chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 19h18M5 16l5-6 4 3 5-8"/><path d="M15 5h4v4"/></svg>',calculator:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M8 7h8M8 12h2m4 0h2m-8 4h2m4 0h2"/></svg>',paw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="16" rx="6" ry="4.5"/><ellipse cx="5.5" cy="9" rx="1.5" ry="2"/><ellipse cx="10" cy="6.5" rx="1.5" ry="2"/><ellipse cx="15" cy="6.5" rx="1.5" ry="2"/><ellipse cx="19.5" cy="9" rx="1.5" ry="2"/></svg>',book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20c-3-2-6-2-9-1V5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1Zm0-14v14"/><path d="M6 9h3m6 0h3"/></svg>',spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z"/></svg>'};

function toast(msg){$('toast').textContent=msg;$('toast').classList.add('visible');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('visible'),2400)}
function lastUsedLabel(value){if(!value)return '尚未使用';const date=new Date(value);if(Number.isNaN(date.getTime()))return '尚未使用';return '上次使用 '+new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(date)}
function render(){
  const list=tools.filter(t=>(currentCat==='全部'||(currentCat==='收藏'?t.favorite:t.category===currentCat))&&[t.name,t.desc,t.url].join(' ').toLowerCase().includes(query)).sort((a,b)=>{
    // 已使用的按最近使用时间倒序；未使用的按 金融工具 → 生活工具 排列
    const ta=a.lastUsed||0,tb=b.lastUsed||0;
    if(ta!==tb)return tb-ta;
    return categoryRank(a.category)-categoryRank(b.category);
  });
  $('tool-count').textContent='共 '+tools.length+' 个工具';
  $('tool-grid').innerHTML=list.length?list.map((t,i)=>`<article class="tool-card" style="animation-delay:${Math.min(i*50,350)}ms"><div class="card-head"><div class="tool-icon">${icons[t.icon]||icons.spark}</div><div class="card-actions"><button type="button" class="icon-btn ${t.favorite?'saved':''}" data-action="favorite" data-id="${esc(t.id)}" title="${t.favorite?'取消收藏':'加入收藏'}" aria-label="${t.favorite?'取消收藏':'加入收藏'}">${t.favorite?'★':'☆'}</button></div></div><div class="card-category">${esc(t.category)}</div><div class="card-title">${esc(t.name)}</div><div class="card-desc">${esc(t.desc)}</div><div class="card-foot"><a class="visit" data-id="${esc(t.id)}" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" aria-label="在新标签打开${esc(t.name)}">探索工具 <span aria-hidden="true">↗</span></a><span class="last-used">${esc(lastUsedLabel(t.lastUsed))}</span></div></article>`).join(''):'<div class="empty">没有找到匹配的工具，试试其他关键词或分类。<br><br>✦</div>';
}
function bindEvents(){
  $('tabs').onclick=e=>{const btn=e.target.closest('button[data-cat]');if(!btn)return;currentCat=btn.dataset.cat;document.querySelectorAll('.tab').forEach(n=>n.classList.toggle('active',n===btn));render()};
  $('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
  $('tool-grid').onclick=e=>{
    const link=e.target.closest('a.visit[data-id]');
    if(link){const t=tools.find(x=>x.id===link.dataset.id);if(t){t.lastUsed=Date.now();lu[t.id]=t.lastUsed;persistLu();setTimeout(render,50)}return}
    const btn=e.target.closest('button[data-action="favorite"]');
    if(!btn)return;
    const t=tools.find(x=>x.id===btn.dataset.id);if(!t)return;
    t.favorite=!t.favorite;fav[t.id]=t.favorite;persistFav();render();toast(t.favorite?'已加入收藏':'已取消收藏');
  };
}

/* ====================== 银河动态背景（与原版一致） ====================== */
function initGalaxy(){
  const canvas=document.getElementById('galaxy-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  let dpr=Math.min(window.devicePixelRatio||1,2),w=0,h=0,stars=[],shooters=[];
  const pointer={x:-9999,y:-9999,active:false};
  function resize(){
    w=window.innerWidth;h=window.innerHeight;
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count=Math.max(110,Math.min(220,Math.floor((w*h)/9000)));
    stars=Array.from({length:count},()=>{
      return {
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*1.6+.25,
        a:Math.random()*.75+.2,
        tw:Math.random()*Math.PI*2,
        sp:.008+Math.random()*.028,
        hue:Math.random()>.82?42:(Math.random()>.45?220:0)
      };
    });
  }
  function addShooter(){
    shooters.push({x:-80+Math.random()*w*.3,y:Math.random()*h*.35,vx:5+Math.random()*4,vy:1.2+Math.random()*1.3,life:0,ttl:35+Math.random()*20});
  }
  function drawNebula(){
    const g1=ctx.createRadialGradient(w*.18,h*.18,0,w*.18,h*.18,Math.max(w,h)*.28);
    g1.addColorStop(0,'rgba(109,121,255,.10)');g1.addColorStop(1,'rgba(109,121,255,0)');
    ctx.fillStyle=g1;ctx.fillRect(0,0,w,h);
    const g2=ctx.createRadialGradient(w*.78,h*.25,0,w*.78,h*.25,Math.max(w,h)*.22);
    g2.addColorStop(0,'rgba(199,144,255,.08)');g2.addColorStop(1,'rgba(199,144,255,0)');
    ctx.fillStyle=g2;ctx.fillRect(0,0,w,h);
    const g3=ctx.createRadialGradient(w*.55,h*.72,0,w*.55,h*.72,Math.max(w,h)*.26);
    g3.addColorStop(0,'rgba(86,148,255,.07)');g3.addColorStop(1,'rgba(86,148,255,0)');
    ctx.fillStyle=g3;ctx.fillRect(0,0,w,h);
  }
  function animate(t=0){
    ctx.clearRect(0,0,w,h);
    drawNebula();
    for(const s of stars){
      const tw=(Math.sin(t*s.sp+s.tw)+1)/2;
      const dx=s.x-pointer.x,dy=s.y-pointer.y;
      const dist=Math.hypot(dx,dy);
      const near=pointer.active && dist<120;
      const boost=near?(1-dist/120)*1.9:0;
      const alpha=Math.min(1,s.a*(.55+tw*.9)+boost*.55);
      const radius=s.r + (near?boost*1.6:tw*.15);
      ctx.beginPath();
      ctx.fillStyle=s.hue===42?`rgba(245,214,150,${alpha})`:s.hue===220?`rgba(176,205,255,${alpha})`:`rgba(255,255,255,${alpha})`;
      ctx.arc(s.x,s.y,radius,0,Math.PI*2);ctx.fill();
      if(near && radius>1.2){
        ctx.strokeStyle=`rgba(255,239,194,${alpha*.38})`;
        ctx.lineWidth=.7;
        ctx.beginPath();ctx.moveTo(s.x-radius*2.5,s.y);ctx.lineTo(s.x+radius*2.5,s.y);ctx.moveTo(s.x,s.y-radius*2.5);ctx.lineTo(s.x,s.y+radius*2.5);ctx.stroke();
      }
    }
    if(Math.random()<.008 && shooters.length<2) addShooter();
    shooters=shooters.filter(sh=>sh.life++<sh.ttl);
    for(const sh of shooters){
      sh.x+=sh.vx;sh.y+=sh.vy;
      const grad=ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*8,sh.y-sh.vy*8);
      grad.addColorStop(0,'rgba(255,244,210,.95)');grad.addColorStop(1,'rgba(255,244,210,0)');
      ctx.strokeStyle=grad;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(sh.x-sh.vx*9,sh.y-sh.vy*9);ctx.stroke();
    }
    requestAnimationFrame(animate);
  }
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('mousemove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true},{passive:true});
  window.addEventListener('mouseleave',()=>{pointer.active=false});
  window.addEventListener('touchmove',e=>{const t=e.touches&&e.touches[0];if(!t)return;pointer.x=t.clientX;pointer.y=t.clientY;pointer.active=true},{passive:true});
  window.addEventListener('touchend',()=>{pointer.active=false},{passive:true});
  resize();requestAnimationFrame(animate);
}

/* ====================== 密码门流程 ====================== */
function unlock(){
  $('gate').style.display='none';
  document.body.classList.remove('locked');
  loadTools();
}
async function tryUnlock(pw){
  if(!pw)return false;
  const hex=await sha256Hex(SALT+pw);
  return hex===PASS_HASH;
}
$('gate-form').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('gate-btn'),input=$('gate-pass');
  btn.disabled=true;
  const ok=await tryUnlock(input.value);
  btn.disabled=false;
  if(ok){
    try{sessionStorage.setItem(GATE_KEY,'1')}catch{}
    unlock();
    return;
  }
  $('gate-err').textContent='密码不正确，请重试';
  input.value='';input.focus();
  const g=$('gate');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');
};

initGalaxy();
try{if(sessionStorage.getItem(GATE_KEY)==='1')unlock()}catch{unlock()}
})();
